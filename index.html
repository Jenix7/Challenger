<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="format-detection" content="telephone=no">
    <meta name="description" content="Challenger: mantén pulsado y deja que la suerte elija tu reto.">
    <title>Challenger</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overscroll-behavior: none;
        }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.1s ease;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            overflow: hidden;
            position: fixed;
            inset: 0;
            touch-action: none;
        }

        .reto-container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 400px;
        }

        .reto-text {
            font-size: 24px;
            font-weight: 600;
            line-height: 1.4;
            color: white;
        }

        .instruccion {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            opacity: 0.7;
            text-align: center;
            padding: 0 20px;
        }

        /* ---------- Ajustes (ocultos; sin acceso visible salvo el gesto secreto) ---------- */
        .settings-overlay {
            position: fixed;
            inset: 0;
            z-index: 80;
            background: rgba(0, 0, 0, 0.72);
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .settings-overlay.oculto {
            display: none;
        }

        .settings-panel {
            width: 100%;
            max-width: 420px;
            max-height: 86vh;
            overflow-y: auto;
            touch-action: pan-y;
            background: #1e1e1e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: none;
            border-radius: 20px 20px 0 0;
            padding: 18px 20px 26px;
            color: #fff;
        }

        .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .settings-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        .settings-grupo {
            padding: 14px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .settings-grupo h3 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 10px;
        }

        .settings-fila {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14.5px;
        }

        .radio-fila {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 0;
            font-size: 14px;
        }

        .secreto-nota {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
        }

        #trucoCustomTexto {
            width: 100%;
            margin-top: 6px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            resize: vertical;
            user-select: text;
            -webkit-user-select: text;
            touch-action: auto;
        }

        .switch {
            position: relative;
            width: 42px;
            height: 24px;
            flex: none;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            transition: background .2s ease;
            cursor: pointer;
        }

        .slider::before {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            top: 3px;
            background: #fff;
            border-radius: 50%;
            transition: transform .2s ease;
        }

        .switch input:checked + .slider {
            background: #ff3d81;
        }

        .switch input:checked + .slider::before {
            transform: translateX(18px);
        }
    </style>
</head>

<body>

    <div class="reto-container">
        <div class="reto-text" id="retoText">Mantén pulsado para randomizar</div>
    </div>

    <div class="instruccion" id="instruccion">Mantén pulsado en cualquier lugar de la pantalla</div>

    <div class="settings-overlay no-gesture oculto" id="settingsOverlay">
        <div class="settings-panel">
            <div class="settings-header">
                <h2>Ajustes</h2>
                <button type="button" class="icon-btn" id="btnCerrarAjustes" aria-label="Cerrar ajustes">✕</button>
            </div>

            <div class="settings-grupo" style="border-top:none; padding-top:0;">
                <div class="settings-fila">
                    <span>Sonido</span>
                    <label class="switch"><input type="checkbox" id="toggleSonido"><span class="slider"></span></label>
                </div>
                <div class="settings-fila">
                    <span>Vibración</span>
                    <label class="switch"><input type="checkbox" id="toggleVibracion"><span class="slider"></span></label>
                </div>
            </div>

            <div class="settings-grupo">
                <h3>Reto especial</h3>
                <p class="secreto-nota">Puede aparecer en momentos muy concretos de la noche. Elige cuál.</p>
                <label class="radio-fila"><input type="radio" name="trucoPreset" value="0"><span>Besar a la persona que se te indique</span></label>
                <label class="radio-fila"><input type="radio" name="trucoPreset" value="1"><span>Dar un beso a la persona que te indiquen (sí, a esa)</span></label>
                <label class="radio-fila"><input type="radio" name="trucoPreset" value="2"><span>Intercambiar el nombre con la persona que te indiquen el resto de la noche</span></label>
                <label class="radio-fila"><input type="radio" name="trucoPreset" value="3"><span>Pedirle el número a la persona que te indiquen con la excusa más mala posible</span></label>
                <label class="radio-fila"><input type="radio" name="trucoPreset" value="custom"><span>Personalizado:</span></label>
                <textarea id="trucoCustomTexto" rows="2" placeholder="Escribe tu propio reto especial…"></textarea>
            </div>
        </div>
    </div>

    <script>
        // ---------------------------------------------------------------
        // Datos: retos (n = nivel interno: s=suave, p=picante, l=leyenda;
        // no se muestra en pantalla, se conserva para uso futuro)
        // ---------------------------------------------------------------
        const RETOS = [

            { t: "Mandar un WhatsApp random de tu lista y borrarlo al segundo", n: "s" },

            { t: "Ladrar en vez de responder cada vez que te pregunten algo esta noche", n: "p" },

            { t: "Invitar a una copa a la primera persona que pase", n: "p" },
            { t: "Conseguir que te inviten a una copa gratis", n: "p" },
            { t: "Ponerte a hablar con una planta o un árbol durante 5 minutos como si te entendiera", n: "s" },

            { t: "Inflar un globo hasta que explote (si hay alguno a mano)", n: "s" },
            { t: "Hacer flexiones sin parar hasta que el grupo diga basta", n: "l" },
            // Nuevos, pensados para discoteca con desconocidos
            { t: "Pedir a alguien que puntúe tu baile del 1 al 10 y aceptar la nota sin discutir", n: "p" },
            { t: "Presentarte a un grupo de desconocidos como el DJ suplente de esta noche", n: "p" },
            { t: "Pedir una canción al DJ con cara de que es la última petición de tu vida", n: "p" },
            { t: "Brindar con 3 desconocidos sin decir ni una palabra", n: "s" },
            { t: "Conseguir que alguien diga tu nombre como si presentara las campanadas", n: "p" },
            { t: "Imitar el baile de la persona que te indiquen, mal, con cara muy seria", n: "p" },
            { t: "Decirle a alguien que es clavadita a una famosa e inventarte cuál", n: "s" },
            { t: "Hacer una encuesta relámpago a 3 personas sobre qué nota le ponen al DJ", n: "s" },
            { t: "Pedir en la barra 'lo que pediría alguien con mucho criterio' y aceptar lo que te pongan", n: "p" },
            { t: "Convencer a un grupo de desconocidos de que eres el dueño del local", n: "l" },
            { t: "Bailar 30 segundos como si fuera tu canción favorita del mundo (aunque la odies)", n: "s" },
            { t: "Pedirle a un camarero que te recomiende 'lo que pide la gente interesante'", n: "p" },
            { t: "Montar una ovación de pie para la ronda de chupitos de otra mesa", n: "s" },
            { t: "Hacer de reportero y entrevistar a un desconocido sobre 'la noche del siglo'", n: "p" },
            { t: "Inventarte una coreografía de 15 segundos y enseñársela a un grupo", n: "p" },
            { t: "Pedir que te hagan una foto como si fueras portada de revista", n: "s" },
            { t: "Anunciar al grupo que acabas de batir un récord mundial inventado", n: "s" },
            { t: "Hacer de comentarista deportivo del baile de la pista durante 1 minuto", n: "p" },
            { t: "Preguntar a 3 desconocidos cuál es su reto favorito de esta app", n: "s" },
            { t: "Proponer un brindis dramático dedicado a 'los que no pudieron venir esta noche'", n: "s" },
            { t: "Pedir que te voten 'mejor vestido/a de la noche' a un grupo random", n: "p" },
            { t: "Cada vez que te guste una canción, aplaudir como una foca durante 10 segundos", n: "s" },
            { t: "Decirle a la barra que estás celebrando algo random e inventarte qué", n: "p" },
            { t: "Retar a un grupo de desconocidos a un concurso de caras serias: el primero que ría pierde", n: "p" },
            { t: "Pedir que te hagan de fotógrafo oficial de la noche durante 5 minutos", n: "s" }
        ];

        const RETO_TRUCADO_PRESETS = [
            "Besar a la persona que se te indique",
            "Dar un beso a la persona que te indiquen (sí, a esa)",
            "Intercambiar el nombre con la persona que te indiquen el resto de la noche",
            "Pedirle el número a la persona que te indiquen con la excusa más mala posible"
        ];

        const COLORES = [
            '#E74C3C', '#9B59B6', '#3498DB', '#1ABC9C', '#F39C12',
            '#E67E22', '#34495E', '#2C3E50', '#8E44AD', '#2980B9',
            '#16A085', '#27AE60', '#D35400', '#C0392B', '#7F8C8D'
        ];

        // ---------------------------------------------------------------
        // Estado persistido (solo ajustes y el reto especial)
        // ---------------------------------------------------------------
        function cargarJSON(clave, porDefecto) {
            try {
                const v = localStorage.getItem(clave);
                if (!v) return porDefecto;
                return Object.assign({}, porDefecto, JSON.parse(v));
            } catch (e) {
                return porDefecto;
            }
        }

        function guardarJSON(clave, valor) {
            try {
                localStorage.setItem(clave, JSON.stringify(valor));
            } catch (e) { /* almacenamiento no disponible: seguimos sin persistir */ }
        }

        // Por defecto: vibración activada, sonido desactivado
        let ajustes = cargarJSON('challengerAjustes', { sonido: false, vibracion: true });
        let truco = cargarJSON('challengerTruco', { preset: '0', custom: '' });

        function textoTrucadoActual() {
            if (truco.preset === 'custom' && truco.custom && truco.custom.trim()) {
                return truco.custom.trim();
            }
            const idx = parseInt(truco.preset, 10);
            return RETO_TRUCADO_PRESETS[Number.isNaN(idx) ? 0 : idx] || RETO_TRUCADO_PRESETS[0];
        }

        // ---------------------------------------------------------------
        // Referencias DOM
        // ---------------------------------------------------------------
        const retoText = document.getElementById('retoText');
        const instruccion = document.getElementById('instruccion');
        const btnCerrarAjustes = document.getElementById('btnCerrarAjustes');
        const settingsOverlay = document.getElementById('settingsOverlay');
        const toggleSonido = document.getElementById('toggleSonido');
        const toggleVibracion = document.getElementById('toggleVibracion');
        const trucoCustomTexto = document.getElementById('trucoCustomTexto');

        // ---------------------------------------------------------------
        // Randomizador (igual que el original: cada 100ms mientras se mantiene pulsado)
        // ---------------------------------------------------------------
        let isRandomizing = false;
        let randomInterval;
        let currentRetoIndex = -1;
        let currentColorIndex = -1;
        let trucazoActivado = false;
        let modalAbierto = false;

        // Color inicial, igual que en la versión original de la app
        document.body.style.backgroundColor = COLORES[0];

        function elegirReto() {
            let idx;
            do {
                idx = Math.floor(Math.random() * RETOS.length);
            } while (RETOS.length > 1 && idx === currentRetoIndex);
            currentRetoIndex = idx;
            return RETOS[idx];
        }

        function elegirColor() {
            let idx;
            do {
                idx = Math.floor(Math.random() * COLORES.length);
            } while (COLORES.length > 1 && idx === currentColorIndex);
            currentColorIndex = idx;
            return COLORES[idx];
        }

        function pintarTick() {
            const reto = elegirReto();
            retoText.textContent = reto.t;
            document.body.style.backgroundColor = elegirColor();
        }

        function estaEnZonaTruco(y) {
            return y <= window.innerHeight * 0.25;
        }

        function iniciarRandomizacion() {
            if (isRandomizing || modalAbierto) return;
            isRandomizing = true;
            randomInterval = setInterval(pintarTick, 100);
        }

        function detenerRandomizacion() {
            if (!isRandomizing) return;
            isRandomizing = false;
            clearInterval(randomInterval);

            let retoFinal;
            if (trucazoActivado) {
                retoFinal = textoTrucadoActual();
            } else {
                retoFinal = elegirReto().t;
            }
            trucazoActivado = false;

            retoText.textContent = retoFinal;
            document.body.style.backgroundColor = elegirColor();

            vibrar([25, 45, 25]);
            beep();
        }

        // ---------------------------------------------------------------
        // Sonido / vibración
        // ---------------------------------------------------------------
        function vibrar(patron) {
            if (!ajustes.vibracion) return;
            try {
                if (navigator.vibrate) navigator.vibrate(patron);
            } catch (e) { /* no soportado: silencio */ }
        }

        function beep() {
            if (!ajustes.sonido) return;
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                const ctx = new Ctx();
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.type = 'triangle';
                o.frequency.setValueAtTime(880, ctx.currentTime);
                o.frequency.exponentialRampToValueAtTime(240, ctx.currentTime + 0.18);
                g.gain.setValueAtTime(0.16, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
                o.connect(g).connect(ctx.destination);
                o.start();
                o.stop(ctx.currentTime + 0.22);
            } catch (e) { /* audio no disponible: silencio */ }
        }

        // ---------------------------------------------------------------
        // Gesto global: mantener pulsado en cualquier parte = randomizar.
        // Trucos invisibles: zona superior 25%, mantener con dos dedos, y
        // 5 toques cortos y seguidos sobre la instrucción = ajustes.
        // ---------------------------------------------------------------
        function esControlInteractivo(target) {
            return !!(target && target.closest && target.closest('.no-gesture'));
        }

        let pressTimer = null;
        let pressOnInstruccion = false;
        let pressTimerFired = false;

        function iniciarPulsacion(clientY, target, multiTouch) {
            if (esControlInteractivo(target)) return;

            if (target && target.closest && target.closest('.instruccion')) {
                // Pulsación sobre la instrucción: si es corta (<150ms) cuenta
                // como toque para el ajuste oculto y nunca arranca el
                // randomizador de forma visible; si se mantiene, funciona
                // como cualquier otro punto de la pantalla.
                pressOnInstruccion = true;
                pressTimerFired = false;
                pressTimer = setTimeout(() => {
                    pressTimerFired = true;
                    if (estaEnZonaTruco(clientY)) trucazoActivado = true;
                    if (multiTouch) trucazoActivado = true;
                    iniciarRandomizacion();
                }, 150);
                return;
            }

            if (estaEnZonaTruco(clientY)) trucazoActivado = true;
            if (multiTouch) trucazoActivado = true;
            iniciarRandomizacion();
        }

        function finalizarPulsacion() {
            if (pressOnInstruccion) {
                clearTimeout(pressTimer);
                const seRandomizo = pressTimerFired;
                pressOnInstruccion = false;
                pressTimerFired = false;
                if (seRandomizo) {
                    detenerRandomizacion();
                } else {
                    registrarToqueInstruccion();
                }
                return;
            }
            if (isRandomizing) detenerRandomizacion();
        }

        document.addEventListener('mousedown', (e) => {
            iniciarPulsacion(e.clientY, e.target, false);
        });

        document.addEventListener('mouseup', finalizarPulsacion);
        document.addEventListener('mouseleave', finalizarPulsacion);

        document.addEventListener('touchstart', (e) => {
            if (!esControlInteractivo(e.target)) e.preventDefault();
            const t = e.touches[0];
            iniciarPulsacion(t ? t.clientY : 0, e.target, e.touches.length >= 2);
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (isRandomizing) e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            if (e.touches.length === 0) finalizarPulsacion();
        }, { passive: false });

        document.addEventListener('touchcancel', (e) => {
            if (e.touches.length === 0) finalizarPulsacion();
        }, { passive: false });

        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // ---------------------------------------------------------------
        // Ajustes (sin acceso visible: solo vía el gesto secreto)
        // ---------------------------------------------------------------
        function abrirAjustes() {
            toggleSonido.checked = ajustes.sonido;
            toggleVibracion.checked = ajustes.vibracion;
            const radio = document.querySelector(`input[name="trucoPreset"][value="${truco.preset}"]`);
            if (radio) radio.checked = true;
            trucoCustomTexto.value = truco.custom || '';
            settingsOverlay.classList.remove('oculto');
            modalAbierto = true;
        }

        function cerrarAjustes() {
            settingsOverlay.classList.add('oculto');
            modalAbierto = false;
        }

        btnCerrarAjustes.addEventListener('click', cerrarAjustes);
        settingsOverlay.addEventListener('click', (e) => {
            if (e.target === settingsOverlay) cerrarAjustes();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalAbierto) cerrarAjustes();
        });

        toggleSonido.addEventListener('change', () => {
            ajustes.sonido = toggleSonido.checked;
            guardarJSON('challengerAjustes', ajustes);
        });
        toggleVibracion.addEventListener('change', () => {
            ajustes.vibracion = toggleVibracion.checked;
            guardarJSON('challengerAjustes', ajustes);
        });

        document.querySelectorAll('input[name="trucoPreset"]').forEach(radio => {
            radio.addEventListener('change', () => {
                truco.preset = radio.value;
                guardarJSON('challengerTruco', truco);
            });
        });
        trucoCustomTexto.addEventListener('input', () => {
            truco.custom = trucoCustomTexto.value;
            guardarJSON('challengerTruco', truco);
        });

        // ---------------------------------------------------------------
        // Ajuste oculto: 5 toques cortos y seguidos sobre la instrucción
        // ---------------------------------------------------------------
        let tapsInstruccion = 0;
        let tapsInstruccionTimer = null;
        function registrarToqueInstruccion() {
            tapsInstruccion++;
            clearTimeout(tapsInstruccionTimer);
            tapsInstruccionTimer = setTimeout(() => { tapsInstruccion = 0; }, 1500);
            if (tapsInstruccion >= 5) {
                tapsInstruccion = 0;
                clearTimeout(tapsInstruccionTimer);
                abrirAjustes();
            }
        }
    </script>
</body>

</html>
