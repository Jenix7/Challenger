<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#120a2e">
    <meta name="color-scheme" content="dark">
    <meta name="format-detection" content="telephone=no">
    <meta name="description" content="Challenger: mantén pulsado y deja que la suerte elija tu reto.">
    <title>Challenger</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #0b0620;
            --bg-3: #2a0f3f;
            --text: #ffffff;
            --muted: rgba(255, 255, 255, 0.75);
            --muted-2: rgba(255, 255, 255, 0.55);
            --accent: #ff3d81;
            --accent-2: #8b2bff;
            --header-h: 54px;
            --footer-h: 44px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overscroll-behavior: none;
        }

        body {
            position: fixed;
            inset: 0;
            font-family: 'Outfit', 'Poppins', sans-serif;
            color: var(--text);
            background-color: var(--bg-1);
            transition: background-color .08s linear;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* ---------- Splash ---------- */
        .splash {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: radial-gradient(circle at 50% 30%, var(--bg-3), var(--bg-1) 70%);
            transition: opacity .35s ease, visibility .35s ease;
        }

        .splash.splash-oculto {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-logo {
            width: 84px;
            height: 84px;
            filter: drop-shadow(0 8px 24px rgba(139, 43, 255, .55));
            animation: splash-pulse 1.1s ease-in-out infinite;
        }

        .splash-title {
            font-family: 'Fredoka', 'Outfit', sans-serif;
            font-size: 30px;
            font-weight: 600;
            letter-spacing: .5px;
        }

        .splash-sub {
            font-size: 13px;
            color: var(--muted);
        }

        @keyframes splash-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* ---------- Layout shell ---------- */
        .app {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
        }

        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-h);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            background: rgba(10, 5, 28, 0.32);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 40;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo {
            width: 26px;
            height: 26px;
            flex: none;
        }

        .brand-name {
            font-family: 'Fredoka', 'Outfit', sans-serif;
            font-size: 19px;
            font-weight: 600;
            letter-spacing: .3px;
            color: var(--text);
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.12);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            cursor: pointer;
        }

        .icon-btn:active {
            background: rgba(255, 255, 255, 0.22);
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
        }

        /* ---------- Zona del reto ---------- */
        .app-main {
            position: fixed;
            left: 0;
            right: 0;
            top: var(--header-h);
            bottom: var(--footer-h);
            display: flex;
            flex-direction: column;
        }

        .reto-stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 26px;
            min-height: 0;
        }

        .reto-text {
            font-size: clamp(32px, 7vw, 38px);
            font-weight: 600;
            line-height: 1.32;
            text-align: center;
            color: var(--text);
            text-shadow: 0 3px 16px rgba(0, 0, 0, 0.45), 0 1px 3px rgba(0, 0, 0, 0.35);
        }

        .reto-text.pop {
            animation: texto-pop .42s cubic-bezier(.22, 1.4, .36, 1);
        }

        @keyframes texto-pop {
            0% { transform: scale(0.86); opacity: .6; }
            55% { transform: scale(1.06); opacity: 1; }
            100% { transform: scale(1); }
        }

        .hint {
            flex: none;
            text-align: center;
            padding: 0 20px 14px;
            font-size: 18px;
            font-weight: 500;
            color: var(--text);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
            transition: opacity .15s ease;
        }

        .hint.oculto {
            opacity: 0;
            pointer-events: none;
        }

        /* ---------- Footer ---------- */
        .app-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--footer-h);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            color: var(--muted-2);
            background: rgba(10, 5, 28, 0.3);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .version {
            padding: 8px;
            cursor: default;
        }

        /* ---------- Settings overlay ---------- */
        .settings-overlay {
            position: fixed;
            inset: 0;
            z-index: 80;
            background: rgba(5, 2, 18, 0.72);
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .settings-overlay.oculto {
            display: none;
        }

        .settings-panel {
            width: 100%;
            max-width: 420px;
            max-height: 86vh;
            overflow-y: auto;
            touch-action: pan-y;
            background: linear-gradient(180deg, #1c1140, #130a30);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: none;
            border-radius: 26px 26px 0 0;
            padding: 18px 20px 26px;
            color: var(--text);
        }

        .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .settings-header h2 {
            font-size: 19px;
            font-weight: 600;
        }

        .settings-grupo {
            padding: 14px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .settings-grupo h3 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--muted-2);
            margin-bottom: 10px;
        }

        .settings-fila {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 0;
            font-size: 15.5px;
        }

        .radio-fila {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            font-size: 14.5px;
        }

        .secreto-nota {
            font-size: 12.5px;
            color: var(--muted-2);
            margin-bottom: 8px;
        }

        #trucoCustomTexto {
            width: 100%;
            margin-top: 6px;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            user-select: text;
            -webkit-user-select: text;
            touch-action: auto;
        }

        .settings-footer-nota {
            text-align: center;
            font-size: 11.5px;
            color: var(--muted-2);
            padding-top: 14px;
        }

        /* Switch */
        .switch {
            position: relative;
            width: 46px;
            height: 27px;
            flex: none;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            transition: background .2s ease;
            cursor: pointer;
        }

        .slider::before {
            content: "";
            position: absolute;
            width: 21px;
            height: 21px;
            left: 3px;
            top: 3px;
            background: #fff;
            border-radius: 50%;
            transition: transform .2s ease;
        }

        .switch input:checked + .slider {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
        }

        .switch input:checked + .slider::before {
            transform: translateX(19px);
        }
    </style>
</head>

<body>

    <div class="splash" id="splash">
        <svg class="splash-logo" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="sbg" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">

                    <stop offset="0.55" stop-color="#8b2bff" />
                    <stop offset="1" stop-color="#2d12ff" />

                <linearGradient id="sbolt" x1="60" y1="20" x2="140" y2="175" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#fff6c8" />
                    <stop offset="1" stop-color="#ffd23f" />

            </defs>

            <path d="M106 18 L54 104 H88 L80 174 L140 82 H104 Z" fill="url(#sbolt)" stroke="#2d0a4e" stroke-width="4" stroke-linejoin="round" />
        </svg>
        <div class="splash-title">Challenger</div>
        <div class="splash-sub">preparando tu próximo reto…</div>
    </div>

    <div class="app" id="app">

        <header class="app-header">
            <div class="brand">

            <button type="button" class="icon-btn no-gesture" id="btnSettings" aria-label="Ajustes">

                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </header>

        <main class="app-main">
            <div class="reto-stage">
                <p class="reto-text" id="retoText"></p>
            </div>
            <p class="hint" id="hintText">Mantén pulsado para lanzar un reto</p>
        </main>

        <footer class="app-footer">
            <span class="version no-gesture" id="versionTap">v2.4.1</span>
            <span>· © Challenger Labs</span>
        </footer>

        <div class="settings-overlay no-gesture oculto" id="settingsOverlay">
            <div class="settings-panel">
                <div class="settings-header">
                    <h2>Ajustes</h2>
                    <button type="button" class="icon-btn" id="btnCerrarAjustes" aria-label="Cerrar ajustes">✕</button>
                </div>

                <div class="settings-grupo" style="border-top:none; padding-top:0;">
                    <div class="settings-fila">
                        <span>Sonido</span>
                        <label class="switch"><input type="checkbox" id="toggleSonido"><span class="slider"></span></label>
                    </div>
                    <div class="settings-fila">
                        <span>Vibración</span>
                        <label class="switch"><input type="checkbox" id="toggleVibracion"><span class="slider"></span></label>
                    </div>
                </div>

                <div class="settings-grupo" id="secretoGrupo" hidden>
                    <h3>Reto especial</h3>
                    <p class="secreto-nota">Puede aparecer en momentos muy concretos de la noche. Elige cuál.</p>
                    <label class="radio-fila"><input type="radio" name="trucoPreset" value="0"><span>Besar a la persona que se te indique</span></label>
                    <label class="radio-fila"><input type="radio" name="trucoPreset" value="1"><span>Dar un beso a la persona que te indiquen (sí, a esa)</span></label>
                    <label class="radio-fila"><input type="radio" name="trucoPreset" value="2"><span>Intercambiar el nombre con la persona que te indiquen el resto de la noche</span></label>
                    <label class="radio-fila"><input type="radio" name="trucoPreset" value="3"><span>Pedirle el número a la persona que te indiquen con la excusa más mala posible</span></label>
                    <label class="radio-fila"><input type="radio" name="trucoPreset" value="custom"><span>Personalizado:</span></label>
                    <textarea id="trucoCustomTexto" rows="2" placeholder="Escribe tu propio reto especial…"></textarea>
                </div>

                <p class="settings-footer-nota">Challenger v2.4.1 — © Challenger Labs</p>
            </div>
        </div>

    </div>

            { t: "Brindar con 3 desconocidos sin decir ni una palabra", n: "s" },
            { t: "Conseguir que alguien diga tu nombre como si presentara las campanadas", n: "p" },
            { t: "Imitar el baile de la persona que te indiquen, mal, con cara muy seria", n: "p" },
            { t: "Decirle a alguien que es clavadita a una famosa e inventarte cuál", n: "s" },
            { t: "Hacer una encuesta relámpago a 3 personas sobre qué nota le ponen al DJ", n: "s" },
            { t: "Pedir en la barra 'lo que pediría alguien con mucho criterio' y aceptar lo que te pongan", n: "p" },
            { t: "Convencer a un grupo de desconocidos de que eres el dueño del local", n: "l" },
            { t: "Bailar 30 segundos como si fuera tu canción favorita del mundo (aunque la odies)", n: "s" },
            { t: "Pedirle a un camarero que te recomiende 'lo que pide la gente interesante'", n: "p" },
            { t: "Montar una ovación de pie para la ronda de chupitos de otra mesa", n: "s" },
            { t: "Hacer de reportero y entrevistar a un desconocido sobre 'la noche del siglo'", n: "p" },
            { t: "Inventarte una coreografía de 15 segundos y enseñársela a un grupo", n: "p" },
            { t: "Pedir que te hagan una foto como si fueras portada de revista", n: "s" },
            { t: "Anunciar al grupo que acabas de batir un récord mundial inventado", n: "s" },
            { t: "Hacer de comentarista deportivo del baile de la pista durante 1 minuto", n: "p" },
            { t: "Preguntar a 3 desconocidos cuál es su reto favorito de esta app", n: "s" },
            { t: "Proponer un brindis dramático dedicado a 'los que no pudieron venir esta noche'", n: "s" },
            { t: "Pedir que te voten 'mejor vestido/a de la noche' a un grupo random", n: "p" },
            { t: "Cada vez que te guste una canción, aplaudir como una foca durante 10 segundos", n: "s" },
            { t: "Decirle a la barra que estás celebrando algo random e inventarte qué", n: "p" },
            { t: "Retar a un grupo de desconocidos a un concurso de caras serias: el primero que ría pierde", n: "p" },
            { t: "Pedir que te hagan de fotógrafo oficial de la noche durante 5 minutos", n: "s" }
        ];

        const RETO_TRUCADO_PRESETS = [
            "Besar a la persona que se te indique",
            "Dar un beso a la persona que te indiquen (sí, a esa)",
            "Intercambiar el nombre con la persona que te indiquen el resto de la noche",
            "Pedirle el número a la persona que te indiquen con la excusa más mala posible"
        ];

        const COLORES = [
            '#E74C3C', '#9B59B6', '#3498DB', '#1ABC9C', '#F39C12',
            '#E67E22', '#34495E', '#2C3E50', '#8E44AD', '#2980B9',
            '#16A085', '#27AE60', '#D35400', '#C0392B', '#7F8C8D'
        ];

        // ---------------------------------------------------------------
        // Estado persistido (solo ajustes y el reto especial)
        // ---------------------------------------------------------------
        function cargarJSON(clave, porDefecto) {
            try {
                const v = localStorage.getItem(clave);
                if (!v) return porDefecto;
                return Object.assign({}, porDefecto, JSON.parse(v));
            } catch (e) {
                return porDefecto;
            }
        }

        function guardarJSON(clave, valor) {
            try {
                localStorage.setItem(clave, JSON.stringify(valor));
            } catch (e) { /* almacenamiento no disponible: seguimos sin persistir */ }
        }

        let ajustes = cargarJSON('challengerAjustes', { sonido: true, vibracion: true });
        let truco = cargarJSON('challengerTruco', { preset: '0', custom: '' });

        function textoTrucadoActual() {
            if (truco.preset === 'custom' && truco.custom && truco.custom.trim()) {
                return truco.custom.trim();
            }
            const idx = parseInt(truco.preset, 10);
            return RETO_TRUCADO_PRESETS[Number.isNaN(idx) ? 0 : idx] || RETO_TRUCADO_PRESETS[0];
        }

        // ---------------------------------------------------------------
        // Referencias DOM
        // ---------------------------------------------------------------
        const splash = document.getElementById('splash');
        const retoText = document.getElementById('retoText');
        const hintText = document.getElementById('hintText');
        const versionTap = document.getElementById('versionTap');
        const btnSettings = document.getElementById('btnSettings');
        const btnCerrarAjustes = document.getElementById('btnCerrarAjustes');
        const settingsOverlay = document.getElementById('settingsOverlay');
        const toggleSonido = document.getElementById('toggleSonido');
        const toggleVibracion = document.getElementById('toggleVibracion');
        const secretoGrupo = document.getElementById('secretoGrupo');
        const trucoCustomTexto = document.getElementById('trucoCustomTexto');

        // ---------------------------------------------------------------
        // Splash: 1s y fuera
        // ---------------------------------------------------------------
        setTimeout(() => {
            splash.classList.add('splash-oculto');
            setTimeout(() => { splash.style.display = 'none'; }, 400);
        }, 1000);

        // ---------------------------------------------------------------
        // Randomizador
        // ---------------------------------------------------------------
        let isRandomizing = false;
        let randomInterval;
        let currentRetoIndex = -1;
        let currentColorIndex = -1;
        let trucazoActivado = false;
        let modalAbierto = false;
        let yaHuboReto = false;

        // Color inicial, igual que en la versión original de la app
        document.body.style.backgroundColor = COLORES[0];

        function elegirReto() {
            let idx;
            do {
                idx = Math.floor(Math.random() * RETOS.length);
            } while (RETOS.length > 1 && idx === currentRetoIndex);
            currentRetoIndex = idx;
            return RETOS[idx];
        }

        function elegirColor() {
            let idx;
            do {
                idx = Math.floor(Math.random() * COLORES.length);
            } while (COLORES.length > 1 && idx === currentColorIndex);
            currentColorIndex = idx;
            return COLORES[idx];
        }

        function pintarTick() {
            const reto = elegirReto();
            retoText.textContent = reto.t;
            document.body.style.backgroundColor = elegirColor();
        }

        function estaEnZonaTruco(y) {
            return y <= window.innerHeight * 0.25;
        }

        function iniciarRandomizacion() {
            if (isRandomizing || modalAbierto) return;
            isRandomizing = true;
            hintText.classList.add('oculto');
            randomInterval = setInterval(pintarTick, 90);
        }

        function detenerRandomizacion() {
            if (!isRandomizing) return;
            isRandomizing = false;
            clearInterval(randomInterval);

            let retoFinal;
            if (trucazoActivado) {
                retoFinal = textoTrucadoActual();
            } else {
                retoFinal = elegirReto().t;
            }
            trucazoActivado = false;

            retoText.textContent = retoFinal;
            document.body.style.backgroundColor = elegirColor();

            retoText.classList.add('pop');
            setTimeout(() => retoText.classList.remove('pop'), 420);

            vibrar([25, 45, 25]);
            beep();

            yaHuboReto = true;
            hintText.textContent = 'Mantén pulsado para el siguiente reto';
            hintText.classList.remove('oculto');
        }

        // ---------------------------------------------------------------
        // Sonido / vibración
        // ---------------------------------------------------------------
        function vibrar(patron) {
            if (!ajustes.vibracion) return;
            try {
                if (navigator.vibrate) navigator.vibrate(patron);
            } catch (e) { /* no soportado: silencio */ }
        }

        function beep() {
            if (!ajustes.sonido) return;
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                const ctx = new Ctx();
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.type = 'triangle';
                o.frequency.setValueAtTime(880, ctx.currentTime);
                o.frequency.exponentialRampToValueAtTime(240, ctx.currentTime + 0.18);
                g.gain.setValueAtTime(0.16, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
                o.connect(g).connect(ctx.destination);
                o.start();
                o.stop(ctx.currentTime + 0.22);
            } catch (e) { /* audio no disponible: silencio */ }
        }

        // ---------------------------------------------------------------
        // Gesto global: mantener pulsado en cualquier parte = randomizar
        // (incluida la cabecera). Excepciones: controles con .no-gesture.
        // Trucos: zona superior 25% y mantener con dos dedos.
        // ---------------------------------------------------------------
        function esControlInteractivo(target) {
            return !!(target && target.closest && target.closest('.no-gesture'));
        }

        document.addEventListener('mousedown', (e) => {
            if (esControlInteractivo(e.target)) return;
            if (estaEnZonaTruco(e.clientY)) trucazoActivado = true;
            iniciarRandomizacion();
        });

        document.addEventListener('mouseup', () => {
            if (isRandomizing) detenerRandomizacion();
        });

        document.addEventListener('mouseleave', () => {
            if (isRandomizing) detenerRandomizacion();
        });

        document.addEventListener('touchstart', (e) => {
            if (esControlInteractivo(e.target)) return;
            e.preventDefault();
            const t = e.touches[0];
            if (t && estaEnZonaTruco(t.clientY)) trucazoActivado = true;
            if (e.touches.length >= 2) trucazoActivado = true; // segundo disparador: dos dedos
            iniciarRandomizacion();
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (isRandomizing) e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            if (esControlInteractivo(e.target) && !isRandomizing) return;
            if (e.touches.length === 0) detenerRandomizacion();
        }, { passive: false });

        document.addEventListener('touchcancel', (e) => {
            if (e.touches.length === 0) detenerRandomizacion();
        }, { passive: false });

        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // ---------------------------------------------------------------
        // Ajustes
        // ---------------------------------------------------------------
        function abrirAjustes() {
            toggleSonido.checked = ajustes.sonido;
            toggleVibracion.checked = ajustes.vibracion;
            const radio = document.querySelector(`input[name="trucoPreset"][value="${truco.preset}"]`);
            if (radio) radio.checked = true;
            trucoCustomTexto.value = truco.custom || '';
            settingsOverlay.classList.remove('oculto');
            modalAbierto = true;
        }

        function cerrarAjustes() {
            settingsOverlay.classList.add('oculto');
            modalAbierto = false;
        }

        btnSettings.addEventListener('click', abrirAjustes);
        btnCerrarAjustes.addEventListener('click', cerrarAjustes);
        settingsOverlay.addEventListener('click', (e) => {
            if (e.target === settingsOverlay) cerrarAjustes();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalAbierto) cerrarAjustes();
        });

        toggleSonido.addEventListener('change', () => {
            ajustes.sonido = toggleSonido.checked;
            guardarJSON('challengerAjustes', ajustes);
        });
        toggleVibracion.addEventListener('change', () => {
            ajustes.vibracion = toggleVibracion.checked;
            guardarJSON('challengerAjustes', ajustes);
        });

        document.querySelectorAll('input[name="trucoPreset"]').forEach(radio => {
            radio.addEventListener('change', () => {
                truco.preset = radio.value;
                guardarJSON('challengerTruco', truco);
            });
        });
        trucoCustomTexto.addEventListener('input', () => {
            truco.custom = trucoCustomTexto.value;
            guardarJSON('challengerTruco', truco);
        });

        // ---------------------------------------------------------------
        // Ajuste oculto: 5 toques seguidos sobre la versión del pie
        // ---------------------------------------------------------------
        let tapsVersion = 0;
        let tapsVersionTimer = null;
        versionTap.addEventListener('click', () => {
            tapsVersion++;
            clearTimeout(tapsVersionTimer);
            tapsVersionTimer = setTimeout(() => { tapsVersion = 0; }, 1500);
            if (tapsVersion >= 5) {
                tapsVersion = 0;
                clearTimeout(tapsVersionTimer);
                abrirAjustes();
                secretoGrupo.hidden = false;
                setTimeout(() => secretoGrupo.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50);
            }
        });
    </script>
</body>
